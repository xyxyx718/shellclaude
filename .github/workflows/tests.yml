name: Offline Python tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-chatgpt.txt
      - run: python -m py_compile scripts/install.py shellclaude.py shellclaude_lib/auth.py shellclaude_lib/responses.py
      - run: sh -n install.sh
      - run: python -m unittest discover -s tests -v
